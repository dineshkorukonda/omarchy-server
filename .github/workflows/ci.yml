name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check and apply formatting
        if: matrix.os == 'ubuntu-latest'
        run: mix format

      - name: Run unit test suite
        run: mix test

  integration-test:
    name: Integration Tests (Docker SSH Target)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Install dependencies
        run: mix deps.get

      - name: Build and start SSH test fixture
        run: docker compose -f docker-compose.test.yml up -d --build

      - name: Run integration tests
        run: mix test test/integration --include integration

      - name: Tear down test fixture
        if: always()
        run: docker compose -f docker-compose.test.yml down

  package-windows:
    name: Package Windows Release (.zip / .exe)
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: |
          $env:MIX_ENV = "prod"
          mix release ssh_client

      - name: Archive Windows Release
        shell: pwsh
        run: |
          Compress-Archive -Path _build\prod\rel\ssh_client\* -DestinationPath ssh-client-windows-x64.zip

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-windows-x64
          path: ssh-client-windows-x64.zip

  package-linux:
    name: Package Linux Release (.tar.gz)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.18.2'
          otp-version: '27.2'

      - name: Restore dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Build production release
        run: |
          MIX_ENV=prod mix release ssh_client

      - name: Archive Linux Release
        run: |
          tar -czf ssh-client-linux-x64.tar.gz -C _build/prod/rel/ssh_client .

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-client-linux-x64
          path: ssh-client-linux-x64.tar.gz
